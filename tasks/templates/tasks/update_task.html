<!DOCTYPE html>
<html>
<head>
    <title>Update Task</title>
</head>
<body>

    <h1>Update Task</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="title" value="{{ task.title }}">

        <br><br>

        <label>
            Completed
        </label>

        <input type="checkbox" name="completed"
        {% if task.completed %}
            checked
        {% endif %}
        >

        <br><br>

        <button type="submit">
            Update Task
        </button>
    </form>

</body>
</html>
